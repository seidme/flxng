<div class="modal-content-wrapper">
  <div class="head">
    <h2>Analytics</h2>
    <!-- <button class="close-button" (click)="close()">×</button> -->
  </div>
  <div class="body">

    <div class="loading"
         *ngIf="loading">loading...</div>

    <highcharts-chart *ngIf="m2PricePerMonthChartOptions"
                      [Highcharts]="Highcharts"
                      [constructorType]="chartConstructor"
                      [options]="m2PricePerMonthChartOptions"
                      [callbackFunction]="chartCallback"
                      [(update)]="updateFlag"
                      [runOutsideAngular]="runOutsideAngularFlag"
                      style="width: 100%; height: 400px; display: block;"></highcharts-chart>

  </div>
  <div class="foot">
    <!-- <button type="submit"
            (click)="close()">Close</button> -->
  </div>
</div>
